services:
  frontend:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
    networks:
      - gp3ds
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/index.html"]
      interval: 10s
      timeout: 5s
      retries: 3

  nodejs:
    build:
      context: ./nodejs
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - ./nodejs/.env
    environment:
      - PORT=3001
      - FRONTEND_ORIGIN=http://localhost:8000
    networks:
      - gp3ds
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--output-document=-", "http://127.0.0.1:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  php:
    build:
      context: ./php
      dockerfile: Dockerfile
    ports:
      - "8003:8080"
    env_file:
      - ./php/.env
    environment:
      - FRONTEND_ORIGIN=http://localhost:8000
    networks:
      - gp3ds
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--output-document=-", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  dotnet:
    build:
      context: ./dotnet
      dockerfile: Dockerfile
    ports:
      - "8006:8080"
    env_file:
      - ./dotnet/.env
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - GP_SAMPLE_PORT=8080
      - FRONTEND_ORIGIN=http://localhost:8000
    networks:
      - gp3ds
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--output-document=-", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  java:
    build:
      context: ./java
      dockerfile: Dockerfile
    ports:
      - "8004:8080"
    env_file:
      - ./java/.env
    environment:
      - FRONTEND_ORIGIN=http://localhost:8000
    networks:
      - gp3ds
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--output-document=-", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

networks:
  gp3ds:
    driver: bridge
